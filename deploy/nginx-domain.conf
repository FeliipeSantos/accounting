# Nginx: acesso por domínio com HTTPS (Let's Encrypt).
# Usado pelo deploy/vps-update.sh quando o .env tem PUBLIC_DOMAIN: ele troca __DOMAIN__
# e __API_PORT__ e grava em /etc/nginx/sites-available/opencontabil-ip, o mesmo arquivo
# da instalação por IP (só um dos dois modelos fica ativo).
#
# Enquanto o certificado de /etc/letsencrypt/live/__DOMAIN__/ não existe, o script grava
# só o primeiro bloco (porta 80), que já responde à validação do certbot. Por isso o
# bloco HTTPS fica depois da linha marcadora abaixo.
#
# O Nginx entrega a tela (build do React em frontend/dist) e repassa /api e /healthz ao
# gunicorn, que escuta só em 127.0.0.1. Qualquer outro caminho responde 404: código,
# .env, banco e documentos nunca são servidos.

# Limite de requisições ao login (complementa o bloqueio por tentativas do app)
limit_req_zone $binary_remote_addr zone=opencontabil_login:10m rate=10r/m;

# HTTP: validação do Let's Encrypt e redirecionamento para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (só com certificado) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:opencontabil_ssl:10m;
    ssl_session_timeout 1d;

    # Projetos aceitam até 2 MB no app
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;

    root /opt/opencontabil/frontend/dist;

    # mesmos cabeçalhos de segurança que a API envia, mais o HSTS (só faz sentido com HTTPS)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # Página da aplicação: sem cache, para cada atualização chegar na hora.
    # Um add_header aqui anula os do server, por isso os cabeçalhos se repetem.
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    # Scripts e estilos gerados: o nome muda a cada versão, então podem ficar em cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=opencontabil_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:__API_PORT__;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:__API_PORT__;
    }

    # Todo o resto: não existe
    location / {
        return 404;
    }
}
