# Nginx para o backend Flask — copie para /etc/nginx/sites-available/project-accounting
# (substitui o nginx.conf do servidor Node) e troque "seu-dominio.com.br" pelo seu domínio.
#
# O Nginx entrega a tela (lista fechada de arquivos) e repassa /api e /healthz ao gunicorn.
# Qualquer outro caminho responde 404: código, .env, banco e documentos nunca são servidos.
# Veja DEPLOY-FLASK.md.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com.br;

    # validação do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seu-dominio.com.br;

    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Projetos aceitam até 2 MB no app
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;

    # Arquivos da tela: só estes quatro, da pasta do código
    root /opt/project-accounting;

    location = / {
        include /etc/nginx/snippets/project-accounting-static.conf;
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|app\.js|intelligence-ui\.js|styles\.css)$ {
        include /etc/nginx/snippets/project-accounting-static.conf;
        try_files $uri =404;
    }

    # Limite de requisições ao login (complementa o bloqueio por tentativas do app)
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/project-accounting-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/project-accounting-proxy.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/project-accounting-proxy.conf;
    }

    # Todo o resto: não existe
    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }
}

# --- Coloque estas três partes nos lugares indicados -----------------------
#
# 1) Em /etc/nginx/nginx.conf, dentro do bloco "http { ... }" (já existe se o
#    servidor Node foi instalado pelo DEPLOY.md):
#
#    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
