# Nginx: acesso direto pelo IP da VPS numa porta própria, SEM domínio e SEM HTTPS.
# Instalado pelo deploy/vps-install.sh, que troca __PUBLIC_PORT__ (padrão 8082) e
# __API_PORT__ (padrão 8090) pelas portas escolhidas.
#
# Atenção: sem HTTPS, o login e os dados trafegam sem criptografia. Por isso o .env
# usa COOKIE_SECURE=false. Quando houver um domínio, troque por deploy/nginx.conf (HTTPS).
#
# O Nginx entrega a tela (build do React em frontend/dist) e repassa /api e /healthz ao
# gunicorn, que escuta só em 127.0.0.1. Qualquer outro caminho responde 404: código,
# .env, banco e documentos nunca são servidos.

# Limite de requisições ao login (complementa o bloqueio por tentativas do app)
limit_req_zone $binary_remote_addr zone=opencontabil_login:10m rate=10r/m;

server {
    # site padrão da porta: acesso pelo IP (sem nome) cai aqui, e não na página "Welcome to nginx"
    listen __PUBLIC_PORT__ default_server;
    listen [::]:__PUBLIC_PORT__ default_server;
    server_name _;

    # Projetos aceitam até 2 MB no app
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;

    root /opt/opencontabil/frontend/dist;

    # mesmos cabeçalhos de segurança que a API envia (sem HSTS: não há HTTPS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # Página da aplicação: sem cache, para cada atualização chegar na hora
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    # Scripts e estilos gerados: o nome muda a cada versão, então podem ficar em cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=opencontabil_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:__API_PORT__;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:__API_PORT__;
    }

    # Todo o resto: não existe
    location / {
        return 404;
    }
}
