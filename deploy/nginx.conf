# Nginx — copie para /etc/nginx/sites-available/project-accounting e troque
# "seu-dominio.com.br" pelo seu domínio. Os certificados são gerados pelo certbot
# (veja DEPLOY.md); antes disso, comente o bloco "listen 443" inteiro.
#
# O Nginx entrega a tela (build do React em frontend/dist) e repassa /api e /healthz
# ao gunicorn. Qualquer outro caminho responde 404: código, .env, banco e documentos
# nunca são servidos.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com.br;

    # validação do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seu-dominio.com.br;

    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Projetos aceitam até 2 MB no app
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;

    root /opt/project-accounting/frontend/dist;

    # Página da aplicação: sem cache, para cada atualização chegar na hora
    location = / {
        include /etc/nginx/snippets/project-accounting-security.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Scripts e estilos gerados: o nome muda a cada versão, então podem ficar em cache
    location /assets/ {
        include /etc/nginx/snippets/project-accounting-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Limite de requisições ao login (complementa o bloqueio por tentativas do app)
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/project-accounting-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/project-accounting-proxy.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/project-accounting-proxy.conf;
    }

    # Todo o resto: não existe
    location / {
        include /etc/nginx/snippets/project-accounting-security.conf;
        return 404;
    }
}

# --- Coloque estas três partes nos lugares indicados -----------------------
#
# 1) Em /etc/nginx/nginx.conf, dentro do bloco "http { ... }":
#
#    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
#
# 2) Arquivo /etc/nginx/snippets/project-accounting-proxy.conf (o HSTS vai aqui
#    porque um add_header no location anula os do server):
#
#    proxy_http_version 1.1;
#    proxy_set_header Host $host;
#    proxy_set_header X-Real-IP $remote_addr;
#    proxy_set_header X-Forwarded-For $remote_addr;
#    proxy_set_header X-Forwarded-Proto $scheme;
#    proxy_read_timeout 90s;
#    add_header Strict-Transport-Security "max-age=31536000" always;
#
# 3) Arquivo /etc/nginx/snippets/project-accounting-security.conf (mesmos cabeçalhos
#    que a API envia):
#
#    add_header Strict-Transport-Security "max-age=31536000" always;
#    add_header X-Content-Type-Options "nosniff" always;
#    add_header X-Frame-Options "DENY" always;
#    add_header Referrer-Policy "same-origin" always;
#    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
