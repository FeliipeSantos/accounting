# opencontabil em Docker — passo a passo em DOCKER.md
#
#   web        Nginx com a tela; única porta publicada (HTTP_PORT, padrão 8080)
#   api        backend Flask (gunicorn); só a rede interna chega nele
#   scheduler  coletas diárias (Publicações e Calendário) e cópia diária do banco
#
# Os três usam a mesma imagem de código e o volume "data" (banco, cópias e PDFs).

name: opencontabil

x-backend: &backend
  build:
    context: .
    target: api
  image: opencontabil-api:latest
  env_file:
    - path: .env.docker
      required: false
  volumes:
    - data:/data
  restart: unless-stopped

services:
  api:
    <<: *backend
    # sobe a api depois de aplicar as migrations (entrypoint.sh)
    command: ["gunicorn", "-c", "gunicorn.conf.py", "wsgi:app"]
    stop_grace_period: 30s

  scheduler:
    <<: *backend
    command: ["scheduler.sh"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: opencontabil-web:latest
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
