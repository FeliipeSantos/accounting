# Nginx do container "web": entrega a tela (build do React) e repassa /api e /healthz
# ao container "api". Qualquer outro caminho responde 404.
#
# Ele fala HTTP na porta 80. O HTTPS fica num proxy na frente (Nginx/Caddy/Traefik da
# máquina, Cloudflare...), que deve repassar o IP do visitante em X-Forwarded-For.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # IP real do visitante quando há um proxy na frente (redes privadas e do Docker);
    # sem isso, o limite de tentativas de login trataria todos como um só IP
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Projetos aceitam até 2 MB e a foto do perfil até 1 MB no app
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # Página da aplicação: sem cache, para cada atualização chegar na hora
    location = / {
        include /etc/nginx/snippets/opencontabil-security.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Scripts e estilos gerados: o nome muda a cada versão, então podem ficar em cache
    location /assets/ {
        include /etc/nginx/snippets/opencontabil-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Limite de requisições ao login (complementa o bloqueio por tentativas do app)
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8080;
        include /etc/nginx/snippets/opencontabil-proxy.conf;
    }

    location /api/ {
        proxy_pass http://api:8080;
        include /etc/nginx/snippets/opencontabil-proxy.conf;
    }

    location = /healthz {
        proxy_pass http://api:8080;
        include /etc/nginx/snippets/opencontabil-proxy.conf;
    }

    # Todo o resto: não existe
    location / {
        include /etc/nginx/snippets/opencontabil-security.conf;
        return 404;
    }
}
